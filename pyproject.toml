[project]
name = "tp-rl"
version = "0.1.0"
description = "TP final RL: DQN y PPO (grupo impar)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "gymnasium[classic-control]>=1.1",
    "highway-env>=1.10",
    "numpy",
    "pandas",
    "matplotlib",
    "tyro",
    "moviepy",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
